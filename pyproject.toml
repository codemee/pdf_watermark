[project]
name = "pdf-watermark"
version = "0.0.2"
description = "Add diagonal text watermarks to PDF files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=6.11.0",
    "reportlab>=4.5.0",
]

[project.scripts]
pdf-watermark = "pdf_watermark.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["README.en.md", "docs/**", "tests/**"]
